name: Refresh catalog and capability benchmarks

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch and validate the source snapshot
        run: npm run sync:catalog
      - name: Fetch and validate published benchmark results
        run: npm run sync:benchmarks
      - name: Check code, database, data integrity and build
        run: npm run check
      - name: Commit the verified snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified model catalog and benchmark snapshots'
            git push origin HEAD:main
          fi
