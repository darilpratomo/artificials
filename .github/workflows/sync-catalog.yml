name: Refresh catalog and capability benchmarks

on:
  schedule:
    # Every three hours: a Cloudflare Cron Trigger (wrangler.refresh.jsonc) starts this
    # workflow on time. GitHub's own schedule runs late or not at all when it is busy,
    # so it covers only until the Cloudflare trigger takes over; see the job's `if`.
    - cron: '41 */3 * * *'
    # A daily safety net, whichever trigger is in charge.
    - cron: '11 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Once the Cloudflare trigger has taken over (it sets REFRESH_TRIGGER), GitHub's
    # three-hourly schedule stands down; a skipped job uses no minutes.
    if: >-
      github.event_name != 'schedule' ||
      github.event.schedule == '11 7 * * *' ||
      vars.REFRESH_TRIGGER != 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch and validate the source snapshot
        run: npm run sync:catalog
      # A benchmark source being down must not hold back new catalog releases:
      # the catalog is still checked and published, and the run is marked
      # failed at the end so the problem stays visible.
      - name: Fetch and validate published benchmark results
        id: benchmarks
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:benchmarks
      # Arena's image and video boards are optional in the same way.
      - name: Fetch and validate Arena's image and video leaderboards
        id: arena
        continue-on-error: true
        run: npm run sync:arena
      # What changed since the last snapshot: listed prices, index entries and leaders.
      - name: Record what changed
        id: history
        continue-on-error: true
        run: node scripts/sync-history.mjs
      - name: Check code, database, data integrity and build
        run: npm run check
        env:
          # Link previews change nothing this checks; Workers Builds draws them on deploy.
          SKIP_OG_IMAGES: '1'
      - name: Commit the verified snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified model catalog and benchmark snapshots'
            git push origin HEAD:main
          fi
      - name: Report data that could not be refreshed
        if: steps.benchmarks.outcome == 'failure' || steps.arena.outcome == 'failure' || steps.history.outcome == 'failure'
        run: |
          echo '::error::Benchmark results, Arena leaderboards or the change history were not refreshed this run. The catalog was, and the last valid snapshots stay published.'
          exit 1
