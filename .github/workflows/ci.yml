name: Verify Artificials

# Minutes are free up to GitHub's monthly allowance for private repositories, shared
# with the data refresh. Pushes run the checks and the desktop browser suite; the full
# suite, with mobile Chrome and Safari, runs weekly and on demand. Documentation-only
# changes skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The full browser suite runs on one worker here and takes about 12 minutes.
    timeout-minutes: 25
    env:
      FULL_SUITE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Execute Academy Python examples and local API integration
        run: npm run check:academy
      - run: npx playwright install --with-deps chromium ${{ env.FULL_SUITE == 'true' && 'webkit' || '' }}
      - run: npm run test:e2e -- ${{ env.FULL_SUITE != 'true' && '--project=desktop' || '' }}
        env:
          E2E_PRODUCTION: 1
      - name: Check Worker bundles without deployment
        run: |
          npx wrangler deploy --dry-run
          npx wrangler deploy --dry-run -c wrangler.www.jsonc
          npx wrangler deploy --dry-run -c wrangler.refresh.jsonc
